name: Initialize database

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Previously tested image commit SHA"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    environment: production-database
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Run reviewed migration and idempotent seed
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloudpulse/cloudpulse:${{ inputs.image_sha }}"
          gcloud run jobs update cloudpulse-initialize --region "${{ vars.GCP_REGION }}" --image "$IMAGE" --quiet
          gcloud run jobs execute cloudpulse-initialize --region "${{ vars.GCP_REGION }}" --wait
