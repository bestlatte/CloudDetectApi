name: cloudpulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: cloudpulse
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse -d cloudpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      target: backend-dev
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://cloudpulse:cloudpulse@postgres:5432/cloudpulse
      PUBLIC_BASE_URL: http://backend:8000
      ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      FRONTEND_DIST: /app/static
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend-dev
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    depends_on:
      - backend

  monitor:
    build:
      context: .
      target: backend-dev
    profiles: ["tools"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://cloudpulse:cloudpulse@postgres:5432/cloudpulse
      PUBLIC_BASE_URL: http://backend:8000
    command: ["python", "-m", "app.jobs.run_monitor"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules:

